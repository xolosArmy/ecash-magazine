name: Temporary editorial regeneration

on:
  push:
    branches:
      - editorial/xolosarmy-cypherpunk-column
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out editorial branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - name: Install generator dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Generate canonical static outputs
        run: python scripts/build_site.py
      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "build: regenerate magazine for xolosArmy opinion column"
          git push origin HEAD:editorial/xolosarmy-cypherpunk-column
