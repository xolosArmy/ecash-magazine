name: One-time full editorial regeneration
on:
  push:
    branches:
      - feat/reportaje-tonalli-memo-social-20261112
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Rebuild all generated editorial outputs
        run: python scripts/build_site.py
      - name: Commit complete generated output changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "build(editorial): include all regenerated static pages"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
