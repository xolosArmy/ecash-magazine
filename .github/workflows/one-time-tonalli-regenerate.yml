name: One-time editorial static regeneration
on:
  push:
    branches:
      - feat/reportaje-tonalli-memo-social-20261112

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install editorial generator dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Regenerate canonical static content and index
        run: python scripts/build_site.py
      - name: Commit generated pages, sitemap, RSS and search index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- index.html feed.xml sitemap.xml editorial/generated-pages.json assets/data reportajes generos temas autores blog buscar
          if ! git diff --cached --quiet; then
            git commit -m "build(editorial): regenerate Tonalli Memo feature and indexes"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
